tInnerHTML\":{\"__html\":\"body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}\"}}],[\"$\",\"h1\",null,{\"className\":\"next-error-h1\",\"style\":{\"display\":\"inline-block\",\"margin\":\"0 20px 0 0\",\"padding\":\"0 23px 0 0\",\"fontSize\":24,\"fontWeight\":500,\"verticalAlign\":\"top\",\"lineHeight\":\"49px\"},\"children\":404}],[\"$\",\"div\",null,{\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]]}]}]\n11:T19d0,## Nikmat Kemerdekaan\n\nKemerdekaan sebuah negara adalah nikmat terbesar kurniaan Allah SWT yang bukan semua manusia dapat merasainya. Berapa ramai umat dan bangsa yang mendiami dunia ini semenjak daripada dahulu hinggalah sekarang, tidak berhenti-henti bejuang hanyalah untuk sesuatu yang dinamakan kemerdekaan. Tetapi hingga kini, masih ramai dikalangan bangsa atau Negara yang masih belum kenal erti kemerdekaan. Kehidupan mereka zahir dan batin terbelenggu dalam penjajahan. Segala-galanya disekat dan dijajah termasuklah kehidupan untuk beragama dan tunduk kepada Allah SWT dengan penuh ketenangan.\n\nBerjihad dan berkorban dengan jiwa dan raga untuk memerdekakan negara dari belenggu penjajahan adalah di antara sifat-sifat yang mulia dan disanjung tinggi oleh Islam. Oleh itu, dalam mengenang kembali sejarah kemerdekaan negara kita , generasi yang hidup di zaman ini janganlah melupakan pengorbanan para pejuang kemerdekaan yang telah membuka jalan ini kepada kita. Disebabkan cetusan semangat para pejuang inilah maka kita dapat hidup di zaman ini dan merasai nikmat perjuangan mereka. Justeru itu, sebagai umat yang berhemah tinggi dan berakhlak, kita merasa terpanggil untuk menghormati dan mengenang kembali jasa pahlawan tanah air sama ada yang masih hidup atau yang telah gugur di medan perjuangan.\n\n## Penjahan Fizikal VS Penjahan Mental\n\nEra penjajahan fizikal terhadap bangsa dan Negara ini sudah berakhir lebih 58 tahun yang lalu. Atau lebih tepatnya ketika Kerajaan British mengiktiraf kedaulatan Negara ini pada tanggal 31 Ogos 1957 yang lalu. Persoalannya, adakah kita benar-benar sudah merdeka dalam segala aspek. Generasi muda kita kini semakin parah dan terdedah dengan ancaman penjajahan secara _neo-kolonialisme._ Generasi kini tidak lagi dijajah secara politik atau ketenteraan, sebaliknya minda, akal, cara berfikir, cara berpakaian, cara bersosial serta kefahaman mereka terhadap politik juga sudah jauh berubah.\n\nSejujurnya, penulis beranggapan bahawa kita hanya bebas secara fizikal sahaja tetapi akal, minda serta pola pemikiran kita masih lagi terbelenggu atau terjajah dengan ideologi-ideologi dan falsafah yang bertentangan dengan erti kemanusiaan. Pelbagai usaha dilakukan oleh pelbagai golongan untuk menebarkan benih-benih ideologi yang menyimpang dari norma kehidupan masyarakat Nusantara. Kefahaman  _sekelurisme_ dan _liberalisme_ semakin mendapat tempat dalam kalangan remaja kita. Budaya _Hedonisme_ pula sudah sebati serta tidak dapat dipisahkan lagi dari hidupan harian mereka. Gerakan-gerakan _feminisme_, homoseksual dan LGBT pula semakin garang memperjuangkan idelogi mereka. Manakala gelaja rasuah, penyelewengan serta penyalahgunaan kuasa pula dilihat menjadi rutin harian dalam masyarakat kita.\n\nIslam adalah solusi terbaik bagi menangani masalah keruntuhan moral dan akhlak ini Hal ini kerana, kedatangan Islam ke alam dunia ini membawa mesej dan sifat kemerdekaan. Islam menyeru manusia supaya membebaskan diri dan pemikiran mereka daripada belenggu jahiliah dan kemusyrikan terhadap Allah SWT, membebaskan diri daripada perhambaan terhadapat pangkat, harta mahupun kuasa dan membebaskan negara daripada cengkaman musuh.\n\nIslam dalam erti kata kesejahteraan, kedamaian dan keamanan semuanya menjurus kepada maksud kemerdekaan. Hakikat ini dapat kita lihat semasa perkembangan awal Islam di mana Rasulullah Sallallahu ‘alaihi Wasallam telah membawa kemakmuran kepada Negara Madinah dan memerdekakan Kota Mekah daripada cengkaman kafir Quraisy. Begitu juga perkembangan di zaman Khulafa’ ar-Rasyidin  yang banyak memerdekakan negara dari cengkaman kekufuran.\n\nIslam juga yang bersifat merdeka dalam erti kata yang lain bermaksud bebas daripada keruntuhan akhlak dan kemurkaan Allah. Lantaran itu, Islam telah berjaya menyelamatkan tamadun manusia daripada sistem perhambaan, sama ada perhambaan sesama manusia ataupun perhambaan terhadap hawa nafsu yang diselaputi oleh syirik, kekufuran, kemungkaran dan kemaksiatan.\n\nSeorang penyair Arab yang bernama Ahmad Syauqi berkata dalam syairnya yang bermaksud: “Kekalnya bangsa kerana mulianya akhlak, runtuhnya bangsa kerana runtuhnya akhlak”\n\n## Nikmat Kemerdekaan adalah satu warisan\n\nNikmat kemerdekaan ini adalah suatu perkara yang kita warisi dari perjuangan generasi terdahulu. Generasi awal berjuang sehingga ke titisan darah terakhir demi generasi kini yang mereka tidak pernah jumpa atau tahu akan namanya. Oleh yang demikian, adalah menjadi tanggung jawab kepada kita semua untuk mewariskan pula kemerdekaan ini kepada generasi akan datang. Kitalah yang akan menentukan samada mereka akan hidup bebas merdeka atau merempat dan menjadi pengemis di atas bumi bertuah ini.\n\nCuba kita kenang kembali bagaimana kehidupan generasi terdahulu ketika Negara berada dalam era penjajahan. Kerajaan Melayu Melaka hancur pada tahun 1511 dan kita hanya mengecap manisnya merdeka pada tahun 1957, iaitu selepas 446 tahun dijajah. Saya mengandaikan satu generasi hidup dalam anggaran 60 hingga ke 65 tahun. Oleh itu, terdapat sekurang-kurangnya 7 atau 8 generasi yang ketika hidupnya Negara sedang dijajah dan matinya juga ketika Negara masih terjajah. Mereka langsung tidak pernah merasa nikmat keamanan, atau mengecap kebahagian bahkan tidak dapat melaksanakan kewajipan beragama secara terang-terangan. Adakah ini yang ingin kita wariskan kepada generasi akan datang?\n\nOleh yang demikian, tugas untuk memastikan keamanan, kemakmuran, kestabilan ekonomi dan politik serta semangat integrasi antara kaum kini menjadi tanggungjawab serta amanah yang maha besar ke atas kita semua supaya Negara ini dapat diwariskan kepada genarasi akan datang dalam keadaan yang jauh lebih baik keadaanya dari apa yang kita kecapi. Jangan jadikan kebahagian yang kita miliki kini sebagai barang gadaian atau sebagai batu loncatan terhadap kepentingan sendiri sehingga menggadaikan kelangsungan hidup generasi akan datang.\n\n## Penutup\n\nJusteru itu, kita semua hendaklah sentiasa berazam untuk membebaskan diri  daripada sifat-sifat yang boleh meruntuhkan wibawa kemanusiaan kerana sifat-sifat yang demikian itu amat dimurkai Allah SWT dan akan hanya menyebabkan manusia terpenjara di bawah arahan nafsu dan telunjuk syaitan. Dan lebih jauh dari itu, kita hendaklah sentiasa memohon keampunan daripada Allah SWT agar mendapat keredhaanNya dan terlepas daripada siksaan api neraka yang bahan bakarnya terdiri daripada manusia dan batu-batan. Inilah dia nilai sebenar kemerdekaan yang perlu kita wariskan kepada generasi akan datang. Semoga Allah SWT senantiasa merahmati dan mengasihi Negara ini.\n\n_**Abdul Razak Bin Mohamad Rawi**_12:T1b84,Dua tiga minggu ini saya sangat teruju apabila aktiviti hujung minggu dipenuhi dengan menghadiri walimatul urus rakan dan taulan. Bahkan ada di kalangan pasangan tersebut yang mendirikan rumah tangga dalam lingkungan usia yang masih muda. Saya mendoakan semoga mereka berbahagi hingga ke Jannah.\n\nHidup berpasangan adalah fitrah semula jadi manusia dan setiap sesuatu itu ada pasangannya seperti malam dan siang, pasang dan surut dan sebagainya. Begitulah juga halnya dengan manusia. Terdapat hikmah yang sangat besar diberikan oleh Allah SWT melalui pensyariatan perkahwinan. Selain dari  ketenangan, kasih sayang dan belas kasihan serta melahirkan zuriat yang soleh, ianya juga adalah satu ibadah serta sunnah Rasulullah SAW. Maka apabila matlamat ini gagal dicapai, maka Islam memberikan ruang kepada pasangan untuk keluar dari rumah tangga tersebut dengan penuh penghormatan melalui perceraian.\n\nDari segi bahasa perceraian iaitu membuka ikatan, melepaskan ikatan, pembebasan dan seumpamanya. Dari segi syarak pula, perceraian membawa maksud membuka ikatan perkahwinan dengan melafazkan perkataan talaq atau cerai atau seumpamanya. Lafaz talaq atau perceraian terbahagi kepada 2 jenis iaitu, Lafaz talaq secara jelas (sareh) serta lafaz talaq secara sindiran (kinayah).\n\n## Lafaz talaq secara nyata (soreh)\n\nLafaz talaq secara nyata (soreh) iaitu lafaz yang menunjukkan maksud perceraian dengan terang dan jelas dengan menggunakan sighah talaq dan tidak memerlukan niat. _Contohnya:”Aku ceraikan engkau dengan talaq satu atau dua atau tiga.”_\n\nDi dalam kes **Zaiton Bin Hamim lwn Abd. Razak Bin Kassim JH (1420)H JLD. XIII BHG 1,** Yang Arif Hakim Bicara telah menyatakan bahawa lafaz talaq yang nyata pula berlaku melalui tiga jenis perkataan iaitu firaq (cerai), saraah (lepas) dan juga talaq.\n\nDoktor Muhammad Aqilah di dalam Kitabnya _Nizhomu usrati fil islam_ menjelaskan jumhur fuqaha sepakat bahawa lafaz cerai melalui sighah “talaq” adalah lafaz yang jelas serta tidak memerlukan niat.\n\nWalau bagaimanapun terdapat perbezaan pendapat dalam kalangan fuqaha berkaitan dengan kalimah firaq (cerai) dan juga saraah (lepas). Imam Asy-Syafie rahimahullah dan juga Imam Ahmad bin Hambal rahimahullah sepakat mengatakan bahawa ianya juga lafaz yang jelas serta tidak memerlukan niat kerana kedua-dua kalimah tersebut dinyatakan oleh Allah SWT di dalam Surah Al-Baqarah ayat 229 dan juga Surah Al-Ahzab ayat 49.\n\nTerdapat juga keadaan dimana si suami tidak berniat untuk menceraikan isterinya tetapi lafaz tersebut terkeluar akibat daripada perasaan marah, tekanan perasaan serta provokasi melampau dari Si Isteri. Walau bagimanapun, ianya tidak akan dikiranya kerana lafaz talaq yang diguna pakai adalah lafaz yang soreh.\n\nPerkara ini telah dijelaskan oleh Hakim Mahkamah Tinggi Syariah Pulau Pinang dalam kes **Zainuddin Kamaruzzaman lwn Khairuzita Khairuddin,** **\\[2006\\] 1 CLJ (Sya),** _“…Jikapun perayu hanya berniat untuk ‘warning’ sahaja ketika melafazkan lafaz pertama, niat tersebut tidak bermakna apa-apa. Ini kerana, lafaz cerai pada lafaz pertama adalah lafaz soreh, dan kerana itu, sama ada niat untuk mencerai wujud ataupun tidak, ia tidak memberi kesan kepada lafaz…”_\n\nDisamping itu, Rasulullah SAW juga pernah bersabda di dalam sebuah hadis yang bermaksud :-_“…Tiga perkara yang dibuat bersungguh-sungguh ia akan menjadi bersungguh-sungguh, dan jika dibuat main-main pun akan menjadi bersungguh-sungguh, iaitu nikah, cerai dan ruju’…”_ (Riwayat: Abu Daud \u0026 Ibnu Majah)\n\n## Lafaz talaq secara sindiran (kinayah)\n\nLafaz talaq secara sindiran (kinayah) pula ialah lafaz yang boleh ditafsirkan sebagai cerai atau selain cerai.  Oleh yang demikian, ianya mestilah disertai dengan niat untuk bercerai dari si suami. _Contohnya:”Hubungan kita sampai disini sahaja” atau “Saya tak hendak kamu lagi.”_\n\nBagi memutuskan perkara ini, pihak-pihak sama ada si suami mahupun si isteri perlulah menfailkan suatu permohonan pengesahan lafaz cerai berdasarkan perunrukan Seksyen 57 Enakmen Undang-undang Keluarga Islam (negeri Selangor) 2003 dan pihak mahkamah akan menilai samada lafaq tersebut dikategorikan sebagai lafaz talaq ataupun tidak.\n\nAntara elemen yang diperlukan di dalam situasi begini ialah niat untuk menceraikan si isteri daripada si suami. Memandangkan ianya adalah lafaz yang beralas/berlapik maka niat daripada suami adalah sangat penting untuk dinilai sebelum Mahkamah membuat keputusan.\n\n## Rujuk\n\nSyeikh Muhammad Makhyuddin Abdul Hamid menjelaskan di dalam Kitabnya, _Ahwalul Sakhsiah fil Syariatil Islamiah_ bahawa rujuk dari segi syarak bermaksud meneruskan hubungan suami isteri dan menghilangkan sebab yang menghalangnya iaitu talaq dan terdapat dua syarat bagi rujuk iaitu dilakukan bagi talaq raj’ie dan juga dilakukan di dalam tempoh iddah si isteri.\n\nTerdapat pandangan daripada sesetengah ulama’ yang menyatakan bahawa rujuk tidak memerlukan kerelaan pihak isteri, pengetahuan serta kesaksian tetapi Imam Asy-Syafie rahimahullah di dalam Kitabnya, _Al-Umm (Kitab Induk),_ Jilid Ke-8 berpendapat sebaliknya.\n\nImam Asy-Syafie rahimahullah memberi saranan supaya diadakan dua orang saksi  bagi proses rujuk supaya tidak berlaku pertelingkahan mengenainya. Beliau juga menambah bahawa rujuk hanya berlaku secara lisan sahaja. Tidak ada rujuk melalui perbuatan (persetubuhan/pergaulan) antara suami dan isteri. Tidak dikira berlakunya rujuk selagi si suami tidak menyatakan hasratnya untuk merujuk kembali isterinya sebagaimana tidak berlakunya nikah dan talaq sehinggalah si suami melafazkan ijab bagi nikah serta lafaz talaq.\n\nPandangan Imam Asy-Syafie ini adalah selari dengan peruntukan Seksyen 52 (9) dan (10) Enakmen Keluarga Islam (Negeri selangor) 2003 yang menggunakan terma **MELAFAZKAN** di dalam kedua-dua peruntukan tersebut. Hal ini jelas menyatakan bahawa, Undang-undang tidak mengiktiraf wujudnya rujuk melalui perbuatan sebaliknya ianya haruslah **DILAFAZKAN** ataupun dilakukan secara **LISAN** kepada si isteri.\n\nSaya menyarankan kepada pasangan suami – isteri khususnya pihak suami supaya mendalami ilmu rumah tangga dan jika berlaku sesuatu perbalahan, selesaikanlah ia dengan penuh hikmah dan bijaksana. Elakkan pertengkaran dan bertikan lidah dengan si isteri kerana dikhuatiri lidah akan tergelincir mengeluarkan kalimah talaq kerana syaitan akan senantiasi berusaha untuk meruntuhkan mahligai rumah tangga anak Adam. Peliharalah lidah daripada mudah melafazkan kata-kata cerai kerana terlajak perahu boleh diundur, terlajak kata buruk padahnya.\n\nAda juga pihak yang sangat sinikal berkaitan dengan perbincangan tentang perceraian. Mereka mengatakan bahawa untuk apa bincang pasal cerai, kahwin pun belum. Ada juga yang mengatakan “ ini kursus kahwin ke, kursus cerai”. Peribahasa melayu ada mengingatkan kepada kita supaya menyediakan payung sebelum turunnya hujan. Oleh itu, penuhilah dada dengan ilmu rumah tangga agar bahtera yang dibina kekal abadi selamanya serta mendapat keredhoan daripada Allah SWT.\n\n## ABDUL RAZAK BIN MOHAMAD RAWI13:T1c9f,"])</script><script>self.__next_f.push([1,"Kehidupan berumah tangga adalah suatu kehidupan yang sangat kompleks. Hal ini kerana, perkahwinan adalah suatu _muamalah_ yang bukan hanya melibatkan hubungan antara suami dan isteri semata-mata. Bahkan ianya juga adalah subset kepada hubungan dengan keluarga mertua, adik beradik, ipar duai, sahabat handai, rakan sepejabat dan sebagainya. Kesemua kumpulan set ini mempunyai fungsinya tersendiri dalam mengharmonikan kehidupan rumah tangga seseorang individu. Mertua dengan perananannya sebagai mertua, sahabat dengan peranannya sebagai sahabat, dan begitulah seterusnya. Ancaman pihak ketiga dalam rumah tangga akan dapat ditangani jika kesemua set kumpulan manusia ini memainkan peranan masing-masing tanpa cuba untuk mengambil alih peranan pihak lain.\n\nAbu Hurairah _Radhiyallahu ‘Anhu_ berkata bahawa Rasulullah _Shallallahu ‘Alaihi wa Sallam_ bersabda : Sesiapa yang menipu dan merosakkan hubungan seorang hamba sahaya dari tuannya, maka ia bukanlah dari golongan kami, dan siapa yang merosakkan hubungan seorang wanita dari suaminya, maka ia bukanlah dari golongan kami’”. Hadis _shahih_ diriwayatkan oleh _Ahmad, Al-Bazzar, Ibn Hibban dan An-Nasai._\n\nHadis ini telah memberi kecaman keras terhadap dua perbuatan iaitu, Mengganggu hubungan seorang hamba atau pekerja, dengan majikannya sehingga hubungan tersebut rosak dan juga mengganggu atau memisahkan seorang wanita yang berstatus isteri bagi seorang lelaki, sehingga hubungan di antara mereka menjadi rosak, lalu si isteri meminta cerai dari suaminya atau si suami menceraikan isterinya.\n\nPara ulama’ bersepakat bahawa hukum mengganggu dan merosak hubungan sebagaimana dimaksud dalam hadis nabi di atas adalah haram (lihat _al-mausu’ah al-fiqhiyyah_, pada bab _takhbib_). Bahkan Imam Al-Haitami mengkategorikan perbuatan menggangu keharmonian rumah tangga pasangan lain sebagai dosa besar. Dalam kitabnya _Al-Zawajir ‘an Iqtiraf al-Kabair_ beliau menyebutkan bahwa dosa besar iaitu, memisahkan seorang wanita agar terpisah dari suaminya dan merosak seorang suami agar terpisah dari isterinya.\n\nImam Ibnu Qoyyim Rahimahullah pula mengatakan bahawa perbuatan mengganggu atau merosakan rumah tangga orang lain adalah suatu dosa besar. Beliau menegaskan bahawa:-\n\n“…_syari’at_ melarang meminang pinangan saudaranya, maka begitulah juga halnya dengan orang yang merosak hamba sahaya wanitanya atau hamba sahaya laki-lakinya, serta berusaha memisahkan di antara keduanya, dengan kata lain berniat ingin menikahkan seorang wanita yang secara sah masih menjadi isteri orang lain. Perbuatan ini termasuk perbuatan keji dan ianya tidak akan teluput hanya dengan taubat. Kerana taubat, meskipun telah menggugurkan hak Allah, namun hak hamba masih tetap ada…”\n\nAcap kali kita mendengar berita berkaitan pihak ketiga yang memusnahkan sesuatu ikatan perkahwinan. Dengan kehidupan yang serba moden, dipermudahkan lagi dengan teknologi komunikasi yang meluas, maka campur tangan pihak ketiga dalam rumah tangga seseorang bukanlah sesuatu yang asing dalam masyarakat kita pada hari ini. Ada diantaranya yang sememangnya berpunca dari pihak ketiga. Contohnya melibatkan perbuatan sihir, kerana dendam, kerana cemburu dan pelbagai alasan yang gagal dicerna oleh akal yang waras.\n\nAda juga keadaan dimana pihak ketiga ini diberi ruang untuk menjadi pemerhati serta penasihat tidak bertauliah dari suami atau isteri itu sendiri. Jika sekiranya mana-mana pasangan menghadapi masalah dalam kehidupan berumah tangga, adalah dinasihatkan supaya tidak menjadikan masalah tersebut sebagai modal untuk meraih simpati pihak ketiga. Apatah lagi jika pihak ketiga tersebut bukannya dari kaum keluarga serta berlawanan jantina. Ianya akan membuka ruang fitnah serta terdedah kepada masalah yang lebih besar.\n\nMasalah yang berlaku di dalam keluarga (antara suami dan isteri) hendaklah diselesaikan secara matang antara suami dan isteri sahaja. Jika tidak ada penyelesaian, dapatkan nasihat dari kaum keluarga yang terdekat seperti ayah atau ibu. Pasangan yang mempunyai masalah juga boleh mendapatkan khidmat kaunseling atau nasihat dari pihak yang selayaknya.\n\nPerbuatan mengganggu rumah tangga orang lain ini adalah suatu kesalahan jenayah samada di Mahkamah Sivil atau pun Mahkamah Syariah. Seksyen 498 Kanun Keseksaan (Akta 574) memperuntukkan hukuman penjara selama tidak lebih dari dua tahun dan/atau denda bagi mana-mana individu yang didapati menggoda, memikat, menahan atau membawa pergi (melarikan) isteri orang dengan niat untuk melakukan persetubuhan.\n\nAkta Kesalahan Jenayah Syariah (Wilayah-wilayah Persekutuan) 1997 \\[Akta 559\\] pula memperuntukkan beberapa jenis kesalahan berkaitan dengan kacau ganggu pihak ketiga dalam sesebuah perkahwinan. Seksyen 36 akta tersebut memperuntukkan kesalahan bagi memujuk lari perempuan yang bersuami yang mana jika sabit boleh disenda tidak melebihi tiga ribu ringgit atau dipenjarakan selama tempoh tidak melebihi 3 tahun atau kedua-duanya sekali. Makamah juga boleh memerintahkan perempuan tersebut supaya kembali ke pangkuan suamninya.\n\nSeksyen 37 pula menyentuh tentang kesalahan berkaitan menghalang pasangan yang sudah bernikah daripada hidup sebagai suami-isteri. Jika disabitkan maka individu tersebut boleh didenda tidak melebihi 2 ribu ringgit atau dipenjarakan tidak lebih setahun ataupun kedua-duanya sekali dan mahkamah hendaklah memerintahkansupaya passangan tersebut supaya kembali hidup sebagai pasangan suami isteri yang sah.\n\nSeksyen 38 pula berkaitan kesalahan menghasut suami atau issteri supaya bercerai atau mengabaikan kewajipannya dan tanggung jawabnya sebagai suami atau isteri. Seksyen ini memperuntukkan denda apabila sabit sebanyak tidak melebihi lima ribu ringgit atau penjara tidak me;ebihi tiga tahun atau kedua-duanya sekali.\n\nManakala Seksyen 39 pula berkaitan dengan kesalahan memujuk lari perempuan (bujang) daripada jagaanya ibu bapanya atau penjaganya. Jika sabit maka individu tersebut boleh didenda tidak melebihi tida ribu ringgit atau penjara tidak melebihi dua tahu atau kedua-duanya ssekali.\n\nMemandangkan peruntukan di atas adalah berkaitan dengan kesalahan jenayah maka tindakan pendakwaan hanya akan dilakukan oleh pihak pendakwa jika terdapat laporan yang dibuat. Oleh yang demikian, mana-mana pihak samada suami atau isteri yang tersepit dalam situasi ini hendaklah berani untuk mengambil langkah awal dengan membuat laporan supaya pihak pendakwa boleh memulakan siasatan.\n\nPenulis menyeru kepada pembaca semua untuk sama-sama merenung sebuah hadis dari Rasulullah _shallallahu ‘alaihi wa sallam_ dimana baginda bersabda: “Sesungguhnya Iblis menempatkan singgasananya di atas air, lalu menyebar anak buahnya ke berbagai penjuru, yang paling dekat dengan sang Iblis adalah yang kemampuan fitnahnya paling hebat di antara mereka, salah seorang dari anak buah itu datang kepadanya dan melapor bahawa dirinya telah berbuat begini dan begitu, maka sang Iblis berkata: ‘kamu belum berbuat sesuatu’, lalu seorang anak buah lainnya datang dan melapor bahawa dia telah berbuat begini dan begitu sehingga mampu memisahkan antara seorang suami dari isterinya, maka sang Iblis menjadikan anak buah ini sebagai orang yang dekat dengannya, dan Iblis berkata: ‘tindakanmu sangat bagus sekali’, lalu memeluknya dengan erat”. {H.R. Muslim (5032)}.\n\nABDUL RAZAK BIN MOHAMAD RAWI14:T2af5,AHLUSSUNNAH WAL JAMA’AH: GOLONGAN YANG SELAMAT (al Firqah an-Najiyah)\n\nBersabda Junjungan Besar Nabi Muhammad SAW, maknanya:“dan sesungguhnya ummat ini akan terpecah menjadi 73 golongan, 72 di antaranya di neraka dan hanya satu yang di surga yaitu al-Jama’ah”. (H.R. Abu Dawud)\n\nAkal adalah syahid (saksi dan bukti) akan kebenaran syara’. Inilah sebenarnya yang dilakukan oleh ulama tauhid atau ulama al-kalam (teologi). Yang mereka lakukan adalah taufiq (pemaduan) antara kebenaran syara’ dengan kebenaran akal, mengikuti jejak nabi Ibrahim -seperti dikisahkan al-Quran- ketika membantah raja Namrud dan kaumnya, di mana beliau menundukkan mereka dengan dalil akal. Fungsi akal dalam agama adalah sebagai saksi bagi kebenaran syara’ bukan sebagai peletak dasar bagi agama itu sendiri. Berbeza dengan golongan falsafah yang berbicara tentang Allah, malaikat dan banyak hal lainnya yang hanya berdasarkan penilaian akal semata-mata. Mereka menjadikan akal sebagai dasar agama tanpa memandang ajaran yang dibawa para nabi dan rasul.\n\nPENGENALAN DAN KRONOLOGI SEJARAH\n\nSejarah mencatat bahawa terdapat banyak firqah (golongan) dalam masalah aqidah yang saling bertentangan di antara satu sama lain. Ini fakta yang tidak dapat dibantah. Bahkan dengan tegas dan jelas Rasulullah telah menjelaskan bahawa umatnya akan berpecah menjadi 73 golongan. Semua ini usudah tentunya dengan kehendak Allah dengan berbagai hikmah. Hanya Allah yang Maha Mengetahui segala sesuatu.\n\nSecara ringkasnya Dunia Melayu Sunni sehingga kini adalah berpegang kepada AkidahAhli Sunnah Wal Jamaah berdasarkan kepada ajaran Imam Abu-Hasan al-Asy’ari dan juga Abu Manshur al-Maturidi walaupun sekarang ada pihak yang mencabarnya dan hendak menggantikannya dengan sesuatu yang lain dengan pelbagai alasan bidaah dan sebagainya – ini perlu diteruskan dengan tambahan-tambahan seperlunya samaada dalam hubungan dengan fahaman-fahaman klasik dan tradisional yang tidak benar atau aliran-aliran baharu moden yang perlu diberi huraiannya dalam perspektif.\n\nDari segi kefahaman tentang Hukum Syara’ dan perlaksanaannya pula, masyarakat Islam di Nusantara kebanyakannya berpandukan kepada mazhab Syafi’i. Ini perlu diteruskan dengan tambahan-tambahan seperlunya yang terdiri daripada keputusan-keputusan atau fatwa-fatwa baharu yang diperlukan kerana perkembangan masa dan budaya.\n\nDari segi kerohanian dan akhlak pula, rantau ini dipandukan oleh huraian-huraian Imam al-Ghazali Rahmatullah Alaih khususnya mengikut ajarannya yang ada dalam kitab Ihya’ ‘Ulum al-Din. Kepentingannya sedemikian rupa sehingga bila ditanya kepada almarhum Syaikh Muhammad ‘Abduh tentang buku yang terbaik untuk panduan generasi muda dalam bidang akhlak dan kerohanian maka dijawabnya kitab itu ialah kitab Ihya’ karangan Imam al- Ghazali. Maka kitab itu diringkaskan oleh al-Qasimi rh dalam buku Ma’izatul-Mu’mininnya. Ini perlu diteruskan dengan tambahan-tambahan seperlunya dalam menghadapi masalah-masalah lama atau baharu.\n\nAqidah ini diajarkan di pondok-pondok Ahlussunnah di negara kita Malaysia,Indonesia,Thailand dan lain-lainnya.Dan Alhamdulillah, aqidah ini juga diyakini oleh ratusan juta kaum muslimin di seluruh dunia seperti Brunei, India, Pakistan, Mesir (terutama al-Azhar), negara-negara Syam (Syria, Jordan, Lubnan dan Palestin), Maghribi,Yaman, Iraq, Turki, Chechnya, Afghanistan dan banyak lagi di negara-negara lainnya.\n\nMaka wajib bagi kita untuk sentiasa memberi penuh perhatian dan serius dalam mendalami aqidah al- Firqah al-Najiyah yang merupakan aqidah golongan majoriti. Kerana ilmu aqidah adalah ilmu yang paling mulia, sebab ia menjelaskan pokok atau dasar agama. Abu Hanifah menamakan ilmu ini dengan al-Fiqh al-Akbar. Kerana mempelajari ilmu ini wajib diutamakan dari mempelajari ilmu-ilmu lainnya. Setelah selesai atau khatam mempelajari ilmu ini barulah disusuli dengan ilmu-ilmu Islam yang lain. Inilah method yang diikuti para sahabat nabi dan ulama rabbaniyyun dari kalangan salaf maupun khalaf dalam mempelajari agama ini. Tradisi ini telah bermula dari zaman Rasulullah, sebagaimana yang dikatakan oleh Ibn Umar dan Jundub, maknanya: “Kami ketika remaja saat mendekati baligh- bersama Rasulullah mempelajari iman (tauhid) dan belum mepelajari al-Qur’an. Kemudian kami mempelajari al-Qur’an maka bertambahlah keimanan kami”. (H.R. Ibnu Majah dan dishahihkan oleh al-Hafidz al-Bushiri).\n\nIlmu aqidah juga disebut dengan ilmu kalam. Hal ini kerana ramainya golongan yang menyalahgunakan nama Islam namun menentang aqidah Islam yang sebenar dan banyaknya kalam dari setiap golongan untukmembela aqidah mereka yang sesat. Tidak semua ilmu kalam itu tercela, sebagaimana dikatakan oleh golongan Musyabbihah (kelompok yang menyerupakan Allah dengan makhluk-Nya). Akan tetapi ilmu kalam terbahagi menjadi dua bahagian ; ilmu kalam yang terpuji dan ilmukalam yang tercela. Ilmu kalam yang kedua inilah yang menyalahi aqidah Islam kerana dikarang dan dipelopori oleh golongan-golongan yang sesat seperti Mu’tazilah, Musyabbihah (golongan yang menyerupakan Allah dengan makhluk-Nya, sepeti kaum Wahabiyyah) dan ahli bid’ah lainnya. Adapun ilmu kalam yang terpuji ialah ilmu kalam yang dipelajari oleh Ahlussunah untuk membantah golongan yang sesat. Dikatakan terpuji kerana pada hakikatnya ilmu kalam Ahlussunnah adalah taqrir dan penyajian prinsip-prinsip aqidah dalam formatnya yang sistematik dilengkapi dengan dalil-dalil naqli dan aqli. Dasar-dasar ilmu kalam ini telah wujud di kalangan para sahabat.\n\nPANDANGAN JUMHUR ULAMA TENTANG AQIDAH ASY’ARIYYAH; AQIDAH AHLUSSUNNAH WAL JAMA’AH\n\nAs-Subki dalam Thabaqatnya berkata: “Ketahuilah bahwa Abu al-Hasan al-Asy’ari tidak membawa ajaran baru atau madzhab baru, beliau hanya menegaskan kembali madzhab salaf, menghidupkan ajaran-ajaran sahabat Rasulullah. Penisbatan nama kepadanya kerana beliau konsisten dalam berpegang teguh ajaran salaf, hujjah (argumentasi) yang beliau gunakan sebagai landasan kebenaran aqidahnya juga tidak keluar dari apa yang menjadi hujjah para pendahulunya, kerananya para pengikutnya kemudian disebut Asy’ariyyah. Abu al-Hasan al-Asy’ari bukanlah ulama yang pertama kali berbicara tentang Ahlussunnah wal Jama’ah, ulama-ulama sebelumya juga banyak berbicara tentang Ahlussunnah wal Jama’ah. Beliau hanya lebih memperkuat ajaran salaf itu dengan argumen-argumen yang kuat. Bukankah penduduk kota Madinah banyak dinisbatkan kepada Imam Malik, dan pengikutnya disebut al Maliki. Ini bukan berarti Imam Malik membawa ajaran baru yang sama sekali tidak ada pada para ulama sebelumnya, melainkan karena Imam Malik menjelaskan ajaran-ajaran lama dengan penjelasan yang lebih terang, jelas dan sistematis demikian juga yang dilakukan oleh Abu al-Hasan al-Asy’ari”.\n\nHabib Abdullah ibn Alawi al-Haddad menegaskan bahwa “kelompok yang benar adalah kelompok Asy’ariyah yang dinisbatkan kepada Imam Asy’ari. Aqidahnya juga aqidah para sahabat dan tabi’in, aqidah ahlul haqq dalam setiap masa dan tempat, aqidahnya juga menjadi aqidah kaum sufi sejati. Hal ini sebagaimana diceritakan oleh Imam Abul Qasim al-Qusyayri. Dan Alhamdulillah aqidahnya juga menjadi aqidah kami dan saudara-saudara kami dari kalangan habaib yang dikenal dengan keluarga Abu Alawi, juga aqidah para pendahulu kita. Kemudian beliau melantunkan satu bait sya’ir:\n\nوكن أشعريا في اعتقادك إنه هو المنهل الصافي عن الزيغ والكفر “\n\nJadilah pengikut al Asy’ari dalam aqidahmu, karena ajarannya adalah sumber yang bersih dari kesesatan dan kekufuran”.\n\nIbnu ‘Abidin al Hanafi mengatakan dalam Hasyiyah Radd al Muhtar ‘ala ad-Durr al Mukhtar : “Ahlussunnah Wal Jama’ah adalah al Asya’irah dan al Maturidiyyah”. Dalam kitab ‘Uqud al Almas al Habib Abdullah Alaydrus al Akbar mengatakan : “Aqidahku adalah aqidah Asy’ariyyah Hasyimiyyah Syar’iyyah sebagaimana Aqidah para ulama madzhab syafi’i dan Kaum Ahlussunnah Shufiyyah”. Bahkan jauh sebelum mereka ini Al-Imam al ‘Izz ibn Abd as-Salam mengemukakan bahawa aqidah al Asy’ariyyah disepakati oleh kalangan pengikut madzhab Syafi’i, madzhab Maliki, madzhab Hanafi dan orang-orang utama dari madzhab Hanbali (Fudlala al-Hanabilah). Apa yang dikemukakan oleh al ‘Izz ibn Abd as-Salam ini disetujui oleh para ulama di masanya, seperti Abu ‘Amr Ibn al Hajib (pimpinan ulama Madzhab Maliki di masanya), Jamaluddin al Hushayri pimpinan ulama Madzhab Hanafi di masanya, juga disetujui oleh al Imam at-Taqiyy as-Subki sebagaimana dinukil oleh putranya Tajuddin as-Subki.\n\nGARIS PANDUAN AQIDAH ASY’ARIYYAH\n\nSecara garis besar aqidah asy’ari yang juga merupakan aqidah ahlussunnah wal jama’ah adalah meyakini bahwa Allah ta’ala maha Esa dan tidak ada sekutu bagi-Nya, Allah bukanlah benda yang boleh digambarkan, dan juga bukan benda yang berbentuk dan berukuran. Allah tidak serupa dengan sesuatupun dari makhluk-Nya (laysa kamitslihi syai’). Allah ada dan tidak ada permulaan atau penghabisan bagi kewujudan-Nya, Allah maha kuasa dan tidak ada yang melemahkan-Nya, serta Allah tidak diliputi arah. Allah ada sebelum menciptakan tempat tanpa tempat, Allah wujud setelah menciptakan tempat dan tanpa bertempat. tidak boleh ditanyakan tentangnya bila, dimana dan bagaimana ada-Nya. Allah ada tanpa terikat oleh masa dan tempat. Maha suci Allah dari bentuk (batasan), batas akhir, sisi-sisi, anggota badan yang besar dan anggota badan yang kecil. Allah tidak diliputi satu arah atau enam arah penjuru. Allah tidak seperti makhluk-Nya. Allah maha suci dari duduk, bersentuhan, bersemayam, menyatu dengan makhluk-Nya, berpindah-pindah dan sifat-sifat makhluk lainnya. Allah tidak terjangkau oleh fikiran dan tidak terbayang dalam ingatan, kerana apapun yang terbayang dalam benakmu maka Allah tidak seperti itu. Allah maha hidup, maha mengetahui, maha kuasa, maha mendengar dan maha melihat. Allah berbicara dengan kalam-Nya yang azali sebagaimana sifat-sifat-Nya yang lain juga azali, kerana Allah berbeza dengan semua makhluk-Nya dalam dzat, sifat dan perbuatan-Nya. Barang siapa menyifati Allah dengan sifat makhluknya sungguh dia telah kafir. Allah yang telah menciptakan makhluk dan perbuatan-perbuatan-Nya, Alah juga yang menentukan rezeki dan ajal mereka. Tidak ada yang boleh menolak ketentuan-Nya dan tidak ada yang boleh menghalangi pemberian-Nya. Allah berbuat dalam kerajaan-Nya ini apa yang Allah kehendaki. Allah tidak ditanya perihal perbuatan-Nya melainkan hamba-Nyalah yang akan diminta dipertanggungjawakan atas segala perbuatan-Nya. Apa yang Allah kehendaki pasti terlaksana dan yang tidak Allah kehendaki tidak akan terjadi. Allah bersifat dengan kesempurnaan yang pantas bagi-Nya dan Allah maha suci dari segala bentuk kekurangan. Nabi Muhammad adalah penutup para nabi dan penghulu para rasul. Nabi Muhammad diutuskan oleh Allah ke muka bumi ini untuk semua penduduk bumi, jin maupun manusia. Nabi Muhammad jujur dalam setiap apa yang disampaikannya.\n\n//Razak Rawi"])</script><script>self.__next_f.push([1,"15:I[27201,[\"/_next/static/chunks/3fntmmi971322.js\",\"/_next/static/chunks/3ftc88ipg4k9f.js\"],\"IconMark\"]\n5:[\"$\",\"$L10\",null,{\"initialContent\":{\"site\":{\"name\":\"Nuaim Razak \u0026 Partners\",\"tagline\":\"Khidmat Guaman Syarie\",\"positioning\":\"Bantuan Guaman Syarie \u0026 Nasihat Perundangan Syariah\",\"phoneDisplay\":\"011-6505 5757\",\"whatsappNumber\":\"601165055757\",\"email\":\"nuaimrazak.bangi@gmail.com\",\"address\":\"11-2, Jln Puteri 3A/1, Bandar Puteri Bangi, 43000 Kajang, Selangor\",\"hours\":\"Isnin - Jumaat, 09:00 - 18:00\",\"mapHref\":\"https://maps.google.com/?q=11-2%2C%20Jln%20Puteri%203A%2F1%2C%20Bandar%20Puteri%20Bangi%2C%2043000%20Kajang%2C%20Selangor\",\"facebookHref\":\"https://www.facebook.com/peguamsyarie.nuaimmajemi\",\"tiktokHref\":\"https://www.tiktok.com/@nuaimrazak\"},\"hero\":{\"eyebrow\":\"Nuaim Razak \u0026 Partners\",\"title\":\"Khidmat\\nGuaman Syarie\\nYang Profesional,\\nTelus \u0026 Berpengalaman\",\"paragraph\":\"Nuaim Razak \u0026 Partners menyediakan khidmat guaman Syarie dan nasihat perundangan Syariah bagi membantu individu dan keluarga menyelesaikan isu berkaitan perkahwinan, kekeluargaan Islam, faraid, hibah, wasiat, peng
